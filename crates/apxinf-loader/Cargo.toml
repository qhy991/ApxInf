[package]
name = "apxinf-loader"
version = "0.1.0"
edition = "2021"

[features]
default = ["safetensors", "gguf"]
safetensors = ["dep:serde", "dep:serde_json"]
gguf = ["dep:byteorder"]

[dependencies]
apxinf-core = { path = "../apxinf-core" }
thiserror = "1"
memmap2 = "0.9"
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
byteorder = { version = "1", optional = true }
half = { version = "2", features = ["bytemuck"] }
bytemuck = "1"

[dev-dependencies]
tempfile = "3"
