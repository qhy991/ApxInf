[package]
name = "apxinf-model"
version = "0.1.0"
edition = "2021"

[dependencies]
apxinf-core = { path = "../apxinf-core" }
apxinf-cuda = { path = "../apxinf-cuda", optional = true }
apxinf-loader = { path = "../apxinf-loader" }
apxinf-metal = { path = "../apxinf-metal", optional = true }
thiserror = "1"
once_cell = "1"
half = "2"
serde_json = "1"

[dev-dependencies]
apxinf-tokenizer = { path = "../apxinf-tokenizer" }
sha2 = "=0.10.9"

[features]
default = []
cuda = ["dep:apxinf-cuda"]
accelerate = ["apxinf-core/accelerate"]
metal-w8 = ["dep:apxinf-metal"]

[[example]]
name = "pi05_bf16_tune"
required-features = ["cuda"]

[[example]]
name = "pi05_cutlass_tune"
required-features = ["cuda"]

[[example]]
