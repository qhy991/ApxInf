[package]
name = "apxinf-model"
version = "0.1.0"
edition = "2021"

[dependencies]
apxinf-core = { path = "../apxinf-core" }
apxinf-cuda = { path = "../apxinf-cuda", optional = true }
apxinf-loader = { path = "../apxinf-loader" }
thiserror = "1"
once_cell = "1"
half = "2"
serde_json = "1"

[features]
default = []
cuda = ["dep:apxinf-cuda"]

[[example]]
name = "pi05_bf16_tune"
required-features = ["cuda"]

[[example]]
name = "pi05_cutlass_tune"
required-features = ["cuda"]

[[example]]
name = "pi05_bench"
required-features = ["cuda"]

[[example]]
name = "qwen35_w4a16_probe"
required-features = ["cuda"]

[[example]]
name = "qwen35_gdn_core_probe"
required-features = ["cuda"]

[[example]]
name = "qwen35_gdn_layer_probe"
required-features = ["cuda"]

[[example]]
name = "qwen35_mlp_layer_probe"
required-features = ["cuda"]

[[example]]
name = "qwen35_attention_layer_probe"
required-features = ["cuda"]

[[example]]
name = "qwen35_hybrid_unit_probe"
required-features = ["cuda"]

[[example]]
