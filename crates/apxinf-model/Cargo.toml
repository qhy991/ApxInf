[package]
name = "apxinf-model"
version = "0.1.0"
edition = "2021"

[dependencies]
apxinf-core = { path = "../apxinf-core" }
apxinf-cuda = { path = "../apxinf-cuda", optional = true }
apxinf-loader = { path = "../apxinf-loader", default-features = false, features = ["safetensors"] }
apxinf-metal = { path = "../apxinf-metal", optional = true, default-features = false }
thiserror = "1"
once_cell = { version = "1", optional = true }
half = "2"
serde_json = "1"

[dev-dependencies]
apxinf-tokenizer = { path = "../apxinf-tokenizer" }
sha2 = "=0.10.9"

[features]
default = ["model-registry", "model-llama", "model-qwen35", "model-qwen3vl", "model-pi05"]
model-registry = ["dep:once_cell"]
model-llama = ["model-registry"]
model-qwen35 = []
model-qwen3vl = ["model-registry"]
model-pi05 = ["model-registry"]
cuda = ["dep:apxinf-cuda"]
accelerate = ["apxinf-core/accelerate"]
metal-w8 = ["metal-experiments"]
metal-w8-head-mlp = ["dep:apxinf-metal", "apxinf-metal/w8-head-mlp"]
metal-experiments = ["metal-w8-head-mlp", "apxinf-metal/experiments"]

[[test]]
name = "unified_llm_input"
required-features = ["model-registry"]

[[example]]
name = "pi05_bf16_tune"
required-features = ["model-pi05", "cuda"]

