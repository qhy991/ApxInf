[package]
name = "apxinf-tokenizer"
version = "0.1.0"
edition = "2021"

[features]
default = ["training-tools"]
training-tools = ["tokenizers/progressbar", "tokenizers/esaxx_fast"]

[dependencies]
apxinf-core = { path = "../apxinf-core" }
tokenizers = { version = "0.20", default-features = false, features = ["onig"] }
minijinja = "2"
minijinja-contrib = { version = "2", features = ["pycompat"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
